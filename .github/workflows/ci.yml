name: Verify local recovery workflow
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.lock.txt
      - run: npm --prefix frontend ci
      - run: bash scripts/check.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          .venv/bin/python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:8000/api/health && break; sleep 1; done
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
